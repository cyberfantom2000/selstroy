<template id="project-item-template">
    <div class="flex flex-col gap-4 w-full">
        <div class="flex flex-col">
            <a name="page-ref" class="relative h-[200px]">
                <div name="tags-container" class="absolute z-30 left-4 top-4 flex flex-wrap gap-2">

                </div>

                <div class="absolute z-30 left-4 bottom-4">
                    <span name="title" class="text-5xl text-white"></span>
                </div>

                {% include 'components/dynamic-image.html' %}
            </a>

            <div name="apartments-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 pt-4">
                
            </div>
                        
            <div class="flex w-full justify-center">
                <button name="load-more-btn" class="bg-primary-600 hover:bg-primary-500 rounded-3xl text-gray-300 hover:text-white p-3">
                    Показать еще
                </button>
            </div>
        </div>
    </div>
</template>

<template id="project-tag-template">
    <div class="flex items-center bg-black/50 px-2 rounded-xl">
        <span class="text-sm text-gray-100 dark:text-gray-300"></span>
    </div>
</template>

<template id="project-apartment-template">
    <a href="#" class="flex-1 space-y-2 bg-gray-300 hover:bg-gray-320 dark:bg-gray-760 dark:hover:bg-gray-730 rounded-3xl p-4">
        <div class="h-[200px] lg:h-[200px]">
            {% include 'components/dynamic-image.html' %}
        </div>

        <div class="flex justify-between">
            <div class="flex flex-row text-sm items-center space-x-2 text-gray-600 dark:text-gray-400">
                <span name="type"></span>
                <div class="dot w-1 h-1 rounded-full bg-gray-600 dark:bg-gray-400"></div>
                <span name="square"></span>
                <div class="dot w-1 h-1 rounded-full bg-gray-600 dark:bg-gray-400"></div>
                <span name="items-left"></span>
            </div>

            <span name="min-cost" class="text-xl text-black dark:text-gray-300"></span>
        </div>
    </a>
</template>

<template id="project-apartment-sold-out-template">
    <a href="#" class="flex-1 space-y-2 bg-gray-300 hover:bg-gray-320 dark:bg-gray-760 dark:hover:bg-gray-730 rounded-3xl p-4">
        <div class="h-[200px] lg:h-[200px]">
            {% include 'components/dynamic-image.html' %}
        </div>

        <div class="flex justify-center">
            <span class="text-xl text-black dark:text-gray-300">Распродано</span>
        </div>
    </a>
</template>
