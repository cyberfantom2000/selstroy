<div id="gallery-preview-modal" role="dialog" aria-modal="true" aria-label="Просмотр изображений" class="fixed inset-0 z-50 hidden">
    <div name="background" class="absolute inset-0 bg-black/90"></div>

    <div class="absolute inset-x-4 top-4 flex items-center justify-between gap-4 pointer-events-none z-20">
        <span name="extra-info" aria-live="polite" class="hidden rounded-xl bg-black/50 px-4 py-2 text-lg text-white"></span>
        <button name="close-button" type="button" aria-label="Закрыть просмотр" class="ml-auto flex h-12 w-12 shrink-0 items-center justify-center rounded-full bg-black/50 text-white hover:bg-gray-700 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-white pointer-events-auto">
            <svg class="h-6 w-6" aria-hidden="true">
                <use href="/static/svg/x-mark.svg#x"></use>
            </svg>
        </button>
    </div>

    <div class="absolute inset-x-4 top-20 bottom-20 sm:inset-x-20 sm:bottom-8 flex items-center justify-center pointer-events-none">
        <img alt="Просмотр изображения" draggable="false" class="hidden max-w-full max-h-full object-contain rounded-3xl touch-pan-y touch-pinch-zoom pointer-events-auto">
    </div>

    <div class="absolute inset-x-4 bottom-4 sm:bottom-auto sm:top-1/2 sm:-translate-y-1/2 flex items-center justify-between pointer-events-none z-10">
        <button name="prev-button" type="button" aria-label="Предыдущее изображение" class="flex h-12 w-12 shrink-0 items-center justify-center rounded-full bg-black/50 text-white hover:bg-gray-700 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-white pointer-events-auto">
            <svg class="h-6 w-6" aria-hidden="true">
                <use href="/static/svg/arrow-left.svg#arrow"></use>
            </svg>
        </button>
        <button name="next-button" type="button" aria-label="Следующее изображение" class="flex h-12 w-12 shrink-0 items-center justify-center rounded-full bg-black/50 text-white hover:bg-gray-700 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-white pointer-events-auto">
            <svg class="h-6 w-6" aria-hidden="true">
                <use href="/static/svg/arrow-right.svg#arrow"></use>
            </svg>
        </button>
    </div>
</div>
