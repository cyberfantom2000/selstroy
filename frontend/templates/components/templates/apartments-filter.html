<template id="apartments-filter-template">
    <div class="flex flex-1 flex-col gap-4 py-4 px-2">
        <div class="flex flex-col lg:flex-row gap-2">
            <div name="types-block" class="hidden flex flex-col gap-1 w-full">
                <span class="text-xs text-gray-600 dark:text-gray-500">Количество комнат</span>
                <div name="types" class="flex flex-row flex-wrap gap-1"></div>
            </div>

            <div name="cost-block" class="hidden flex flex-col gap-1 w-full">
                <span class="text-xs text-gray-600 dark:text-gray-500">Стоимость, млн ₽</span>
                <div class="flex flex-col bg-gray-300 dark:bg-gray-600 rounded-2xl gap-2 p-2">
                    <div class="flex items-center justify-between gap-2 px-2">
                        <div class="flex items-center gap-1">
                            <span class="text-gray-500 dark:text-gray-400">от</span>
                            <input type="number" name="cost-min-input" step="0.1" class="w-14 outline-none bg-transparent no-spin text-black dark:text-gray-300">
                        </div>
                        <span class="text-gray-500 dark:text-gray-400">-</span>
                        <div class="flex items-center gap-1">
                            <span class="text-gray-500 dark:text-gray-400">до</span>
                            <input type="number" name="cost-max-input" step="0.1" class="w-14 outline-none bg-transparent no-spin text-black dark:text-gray-300">
                        </div>
                    </div>
                    <div class="relative h-3 mx-1.5">
                        <div name="cost-track" style="left: 0; width: 100%" class="absolute top-1/2 h-1 -translate-y-1/2 rounded-full bg-primary-400"></div>
                        <input type="range" name="cost-min-range" step="0.1" class="absolute left-0 top-0 h-full w-1/2 range-slider range-slider--bare bg-transparent appearance-none"/>
                        <input type="range" name="cost-max-range" step="0.1" class="absolute right-0 top-0 h-full w-1/2 range-slider range-slider--bare bg-transparent appearance-none"/>
                    </div>
                </div>
            </div>
        </div>

        <div class="flex flex-row flex-wrap gap-1">
            <button name="apply-button" class="bg-primary-600 hover:bg-primary-700 dark:bg-primary-700 dark:hover:bg-primary-600 text-white dark:text-gray-300 dark:hover:text-gray-100 rounded-3xl text-sm px-4 py-2 transition-all active:scale-95">Показать квартиры</button>
            <button name="reset-button" class="bg-gray-300 hover:bg-gray-350 dark:bg-gray-600 dark:hover:bg-gray-500 text-gray-800 dark:text-gray-300 rounded-3xl text-sm px-4 py-2 transition-all active:scale-95">Сбросить</button>
        </div>
    </div>
</template>

<template id="apartments-filter-type-template">
    <label class="inline-flex items-center cursor-pointer">
        <input type="checkbox" class="peer hidden" />
        <div class="min-w-16 flex items-center justify-center rounded-2xl p-2 bg-gray-300 dark:bg-gray-600 hover:bg-primary-500 transition peer-checked:bg-primary-500 text-black dark:text-gray-300 hover:text-gray-200 peer-checked:text-gray-200">
            <span></span>
        </div>
    </label>
</template>
