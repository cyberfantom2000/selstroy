<div id="media-subpage" class="flex flex-col w-full h-full p-4 hidden">
    <div class="flex justify-start">
        <button id="choose-media-button" role="tooltip" name="id-tooltip" class="flex items-center justify-center py-2 text-gray-400 hover:text-primary-500 peer-checked:text-primary-500">
            <svg class="h-8 w-8">
                <use href="/static/svg/plus.svg#icon"></use>
            </svg>
            <span>Добавить файл</span>
        </button>
        <input type="file" id="choose-media-input" class="hidden">
    </div>
    <div id="media-wrapper" class="relative flex-1 min-h-[300px]">
        <div id="media-container" class="flex flex-wrap justify-start gap-4">
        </div>

        <div id="media-drop-overlay" class="hidden absolute inset-0 bg-blue-300/80 dark:bg-blue-700/80 border-2 border-dashed border-blue-500 rounded-xl flex items-center justify-center pointer-events-none z-50">
            <h3 class="text-black dark:text-gray-200 font-medium text-2xl">Перетащите файлы сюда</h3>
        </div>
    </div>
</div>

<div id="media-modal" class="fixed inset-0 z-50 hidden">
    <div name="background" class="absolute inset-0 bg-black/50"></div>

    <div class="flex items-center justify-center min-h-screen p-4">
        <div class="relative w-full max-w-6xl bg-gray-200 dark:bg-gray-800 rounded-3xl shadow-xl max-h-[90vh] flex flex-col">
            <div class="flex justify-end p-4 shrink-0">
                <button name="close-button" class="flex items-center justify-center text-gray-500 dark:text-gray-300 hover:text-primary-500 active:scale-95">
                    <svg class="h-6 w-6">
                        <use href="/static/svg/x-mark.svg#x"></use>
                    </svg>
                </button>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-[2fr_1fr] gap-4 p-4 pt-0 overflow-hidden min-h-0 flex-1">
                <div class="flex justify-center items-start w-full min-h-0 overflow-hidden">
                    <div name="image-placeholder" class="flex aspect-square w-full max-h-full hidden">
                        {% include  'components/dynamic-image.html' %}
                    </div>

                    <div name="base-placeholder" class="flex aspect-square w-full max-h-full justify-center hidden">
                        <svg name="base-placeholder" class="w-44 text-gray-800 dark:text-gray-400">
                            <use href="/static/svg/file.svg#icon"></use>
                        </svg>
                    </div>
                </div>

                <div class="flex min-h-0 overflow-hidden">
                    <div class="flex flex-col rounded-3xl bg-gray-300 dark:bg-gray-600 w-full p-4 gap-3 overflow-auto">
                        <div class="flex flex-wrap gap-2">
                            <span class="font-medium text-gray-800 dark:text-gray-250">ID:</span>
                            <span name="id" class="text-gray-600 dark:text-gray-350 break-all"></span>
                        </div>
                        <div class="flex flex-wrap gap-2">
                            <span class="font-medium text-gray-800 dark:text-gray-250">Имя:</span>
                            <span name="name" class="text-gray-600 dark:text-gray-350 break-all"></span>
                        </div>
                        <div class="flex flex-wrap gap-2">
                            <span class="font-medium text-gray-800 dark:text-gray-250">Расширение:</span>
                            <span name="ext" class="text-gray-600 dark:text-gray-350"></span>
                        </div>
                        <div class="flex flex-wrap gap-2">
                            <span class="font-medium text-gray-800 dark:text-gray-250">Размер:</span>
                            <span name="size" class="text-gray-600 dark:text-gray-350"></span>
                        </div>
                        <div class="flex flex-wrap gap-2">
                            <span class="font-medium text-gray-800 dark:text-gray-250">Ссылка:</span>
                            <span name="link" class="text-gray-600 dark:text-gray-350 break-all"></span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<template id="media-item-template">
    <div class="flex flex-row p-2 gap-2 rounded-2xl bg-gray-200 hover:bg-gray-300 dark:bg-gray-750 hover:dark:bg-gray-700">
        <div class="flex flex-col">
            <div class="flex aspect-square hover:cursor-pointer">
                <div name="image-placeholder" class="w-44 hidden">
                    {% include 'components/dynamic-image.html' %}
                </div>
                <svg name="base-placeholder" class="w-44 text-gray-800 dark:text-gray-400">
                    <use href="/static/svg/file.svg#icon"></use>
                </svg>
            </div>
            <h3 name="title" class="w-44 text-center text-gray-800 dark:text-gray-400 truncate overflow-hidden whitespace-nowrap"></h3>
        </div>
        <div class="flex flex-col gap-2">
            <button name="copy-button" class="flex items-center justify-center text-gray-500 dark:text-gray-400 hover:text-primary-500 active:scale-95">
                <svg class="h-4 w-4">
                    <use href="/static/svg/copy.svg#icon"></use>
                </svg>
            </button>
            <button name="link-button" class="flex items-center justify-center text-gray-500 dark:text-gray-400 hover:text-primary-500  active:scale-95">
                <svg class="h-4 w-4">
                    <use href="/static/svg/link.svg#icon"></use>
                </svg>
            </button>
            <button name="download-button" class="flex items-center justify-center text-gray-500 dark:text-gray-400 hover:text-primary-500  active:scale-95">
                <svg class="h-5 w-5">
                    <use href="/static/svg/download.svg#icon"></use>
                </svg>
            </button>
            <button name="delete-button" class="flex items-center justify-center text-gray-500 dark:text-gray-400 hover:text-red-500  active:scale-95">
                <svg class="h-5 w-5">
                    <use href="/static/svg/trash.svg#icon"></use>
                </svg>
            </button>
        </div>
    </div>
</template>
