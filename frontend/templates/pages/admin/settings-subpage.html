<section id="settings-subpage" class="hidden w-full p-4 text-gray-800 dark:text-gray-300" aria-labelledby="settings-title">
    <h1 id="settings-title" class="text-2xl font-semibold mb-4">Настройки главной страницы</h1>
    <p name="status" role="status" aria-live="polite" class="mb-4 text-sm text-gray-600 dark:text-gray-400"></p>
    <p name="error" role="alert" class="hidden mb-4 text-sm text-red-600 dark:text-red-400 break-words"></p>
    <button name="retry-button" type="button" class="hidden mb-4 rounded-xl bg-gray-300 dark:bg-gray-600 px-4 py-2 disabled:opacity-50">Повторить загрузку</button>

    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
        <fieldset name="image-controls" disabled class="min-w-0 rounded-3xl bg-white dark:bg-gray-900 p-4 md:p-6">
            <legend class="sr-only">Главное изображение</legend>
            <h2 class="text-lg font-semibold mb-2">Главное изображение</h2>
            <p class="text-sm text-gray-600 dark:text-gray-400 mb-4">Загрузите изображение в медиатеку и скопируйте его ID. Замена и снятие картинки сохраняются сразу.</p>
            <div name="hero-image" class="flex flex-col gap-3">
                <div class="flex items-center justify-center h-64 rounded-2xl bg-gray-100 dark:bg-gray-800 overflow-hidden">
                    <img alt="Главное изображение" class="hidden w-full h-full object-cover cursor-pointer">
                    <p name="image-placeholder" class="p-4 text-center text-sm text-gray-500 dark:text-gray-400">Изображение не задано</p>
                </div>
                <div class="flex flex-wrap gap-3">
                    <button name="edit-button" type="button" class="rounded-xl bg-primary-600 hover:bg-primary-700 text-white px-4 py-2 disabled:opacity-50">Указать ID изображения</button>
                    <button name="remove-button" type="button" disabled class="rounded-xl bg-gray-200 dark:bg-gray-700 px-4 py-2 disabled:opacity-50">Снять изображение</button>
                </div>
            </div>
            <p class="mt-3 text-sm text-gray-600 dark:text-gray-400">Снятие изображения не удаляет файл из медиатеки.</p>
        </fieldset>

        <form name="statistics-form" class="min-w-0 rounded-3xl bg-white dark:bg-gray-900 p-4 md:p-6">
            <fieldset name="statistics-controls" disabled class="min-w-0 flex flex-col gap-4">
                <legend class="sr-only">Показатели главной</legend>
                <h2 class="text-lg font-semibold">Показатели главной</h2>
                <label class="flex flex-col gap-1">
                    <span>Лет на рынке</span>
                    <input name="yearsOnMarket" type="number" required min="0" step="1" max="9007199254740991" class="w-full rounded-xl bg-gray-100 dark:bg-gray-700 px-3 py-2">
                </label>
                <label class="flex flex-col gap-1">
                    <span>Введено площади, м²</span>
                    <input name="commissionedArea" type="number" required min="0" step="1" max="9007199254740991" class="w-full rounded-xl bg-gray-100 dark:bg-gray-700 px-3 py-2">
                </label>
                <label class="flex flex-col gap-1">
                    <span>Построено домов</span>
                    <input name="housesBuilt" type="number" required min="0" step="1" max="9007199254740991" class="w-full rounded-xl bg-gray-100 dark:bg-gray-700 px-3 py-2">
                </label>
                <label class="flex flex-col gap-1">
                    <span>Жителей</span>
                    <input name="residentsCount" type="number" required min="0" step="1" max="9007199254740991" class="w-full rounded-xl bg-gray-100 dark:bg-gray-700 px-3 py-2">
                </label>
                <button type="submit" class="self-start rounded-xl bg-primary-600 hover:bg-primary-700 text-white px-4 py-2 disabled:opacity-50">Сохранить показатели</button>
            </fieldset>
        </form>
    </div>
</section>
