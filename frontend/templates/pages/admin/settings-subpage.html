<section id="settings-subpage" class="hidden w-full p-4 text-gray-800 dark:text-gray-300" aria-labelledby="settings-title">
    <h1 id="settings-title" class="text-2xl font-semibold mb-4">Настройки главной страницы</h1>

    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
        <fieldset name="image-controls" disabled class="min-w-0 rounded-3xl bg-white dark:bg-gray-900">
            <legend class="sr-only">Главное изображение</legend>
            <div class="flex h-full flex-col">
                <h2 class="mx-4 mt-4 text-lg font-semibold">Главное изображение</h2>
                <div name="hero-image" class="relative m-2 grow min-h-64 [&>div]:absolute [&>div]:inset-0 [&>div]:w-full [&>div]:h-full [&_img]:object-cover"></div>
            </div>
        </fieldset>

        <form name="statistics-form" class="min-w-0 rounded-3xl bg-white dark:bg-gray-900 p-4 md:p-6">
            <fieldset name="statistics-controls" disabled class="min-w-0 flex flex-col gap-4">
                <legend class="sr-only">Показатели главной</legend>
                <h2 class="text-lg font-semibold">Показатели главной</h2>
                <label class="flex flex-col gap-1">
                    <span>Лет на рынке</span>
                    <input name="yearsOnMarket" type="number" required min="0" step="1" max="9007199254740991" class="w-full rounded-xl bg-gray-100 dark:bg-gray-700 px-3 py-2">
                </label>
                <label class="flex flex-col gap-1">
                    <span>Введено площади, м²</span>
                    <input name="commissionedArea" type="number" required min="0" step="1" max="9007199254740991" class="w-full rounded-xl bg-gray-100 dark:bg-gray-700 px-3 py-2">
                </label>
                <label class="flex flex-col gap-1">
                    <span>Построено домов</span>
                    <input name="housesBuilt" type="number" required min="0" step="1" max="9007199254740991" class="w-full rounded-xl bg-gray-100 dark:bg-gray-700 px-3 py-2">
                </label>
                <label class="flex flex-col gap-1">
                    <span>Жителей</span>
                    <input name="residentsCount" type="number" required min="0" step="1" max="9007199254740991" class="w-full rounded-xl bg-gray-100 dark:bg-gray-700 px-3 py-2">
                </label>
                <button type="submit" disabled class="self-start rounded-xl bg-primary-600 hover:bg-primary-700 text-white px-4 py-2 disabled:opacity-50">Сохранить показатели</button>
            </fieldset>
        </form>
    </div>
</section>
