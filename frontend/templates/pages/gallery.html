{% extends 'base.html' %}

{% block content %}
    <div class="w-full bg-gray-200 dark:bg-gray-800">
        <div class="max-w-xl md:max-w-4xl lg:max-w-7xl mx-auto py-4">
            <section id="gallery" class="flex flex-col gap-4 px-4" aria-labelledby="gallery-title" aria-busy="true">
                <h1 id="gallery-title" class="text-black dark:text-gray-300 text-3xl md:text-4xl lg:text-4xl text-center lg:text-left">Наши объекты</h1>

                <div name="items" id="gallery-container" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4"></div>
                <p name="empty" role="status" class="hidden rounded-3xl bg-gray-100 dark:bg-gray-900 px-6 py-12 text-center text-gray-600 dark:text-gray-400">Фотографии объектов скоро появятся.</p>
            </section>
        </div>
    </div>

    {% include 'components/templates/gallery-item.html' %}
    {% include 'components/templates/gallery-preview.html' %}

{% endblock %}

{% block include_js %}
<script type="module" src="/static/js/pages/initializers/gallery.mjs"></script>
{% endblock %}
